[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-eval-ops"
version = "0.1.0"
description = "A small RAG evaluation harness with LLMOps regression testing (toy corpus, stdlib only)"
authors = [{name = "Sujit Adhikari"}]
license = "MIT"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
rageval = "rageval.runner:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
